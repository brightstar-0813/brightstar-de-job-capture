<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Data Eng Jobs Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <h1>Data Eng Jobs Capture</h1>
      <p id="statusLine" class="muted">Connecting…</p>
      <p id="jrLine" class="muted"></p>
    </header>

    <div class="actions">
      <button type="button" id="btnRunDice">Run capture (API)</button>
      <button type="button" id="btnRunJr">Capture JobRight</button>
      <button type="button" id="btnRefresh" class="secondary">Refresh</button>
      <a id="btnExport" class="button secondary" href="#">Export CSV</a>
    </div>

    <p id="message" class="message" hidden></p>
    <p class="hint muted">
      JobRight uses this Chrome login (stay signed in on jobright.ai). Full multi-site capture runs via local API / Task Scheduler.
      Keep <code>npm start</code> running for ingest. Export is one combined <code>jobs_latest.csv</code>.
    </p>

    <section>
      <h2>New jobs</h2>
      <ul id="jobList" class="job-list"></ul>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
